<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<meta property="og:title" content="{{ site.Title }}">
<meta property="og:description" content="{{ site.Params.description }}">
<link rel="canonical" href="{{ .Permalink }}">
<style>
:root { --fg:#1a1a1a; --muted:#666; --link:#0b57d0; --bg:#fff; --line:#e5e5e5; }
@media (prefers-color-scheme: dark) { :root { --fg:#e8e8e8; --muted:#9a9a9a; --link:#8ab4f8; --bg:#121212; --line:#2a2a2a; } }
* { box-sizing: border-box; }
body { margin:0 auto; max-width:760px; padding:48px 16px; font:17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color:var(--fg); background:var(--bg); }
a { color:var(--link); text-decoration:none; } a:hover { text-decoration:underline; }
h1 { font-size:2rem; margin:0 0 4px; } h2.sec { font-size:1.1rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:48px 0 16px; border-bottom:1px solid var(--line); padding-bottom:6px; }
.sub { color:var(--muted); margin:0 0 16px; } .links a { margin-right:16px; font-weight:500; }
.project { display:flex; gap:20px; margin-bottom:28px; } .project img { width:200px; height:120px; object-fit:cover; border-radius:6px; flex-shrink:0; }
.project h3 { margin:0; font-size:1.05rem; } .project p { margin:4px 0; } .project .links a { font-size:.95rem; margin-right:12px; }
.muted { color:var(--muted); } ul.plain { list-style:none; padding:0; } ul.plain li { display:flex; justify-content:space-between; gap:12px; padding:3px 0; }
img { max-width:100%; height:auto; } pre { overflow-x:auto; padding:12px; border-radius:6px; font-size:.85rem; }
footer { margin-top:64px; color:var(--muted); font-size:.85rem; }
@media (max-width:600px) { .project { flex-direction:column; } .project img { width:100%; height:auto; aspect-ratio:16/9; } }
</style>
</head>
<body>
{{ if not .IsHome }}<p><a href="/">← {{ site.Title }}</a></p>{{ end }}
{{ block "main" . }}{{ end }}
<footer>© {{ now.Year }} {{ site.Title }}</footer>
</body>
</html>
