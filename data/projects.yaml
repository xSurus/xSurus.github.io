- title: Monocular depth estimation under distribution shift
  year: 2026
  text: >-
    Computational Intelligence Lab project. Frozen DINOv2 ViT-L encoder with a DPT head predicting
    depth and confidence. A CLIP-based audit found vegetation scenes under-represented in training,
    so we added diffusion-generated overgrown images and a CLIP-gated SAM refinement stage.
  links:
    - [code, https://github.com/xSurus/CIL_Monocular_depth]

